<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Missão Simplificar</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;padding:0;font-family:'DM Sans',sans-serif}
    body{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#082C23,#14532d)}
    .login-card{width:100%;max-width:380px;background:#fff;border-radius:16px;padding:36px 32px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
    .brand-name{color:#082C23;font-weight:800;font-size:20px;letter-spacing:1px;text-align:center;line-height:1.3}
    .brand-sub{display:block;color:#16a34a;font-size:10px;font-weight:700;letter-spacing:2px;margin-top:2px;text-align:center}
    .field-label{font-size:12px;font-weight:600;color:#374151;margin-bottom:6px;display:block}
    .field-input{width:100%;border:1px solid #e5e7eb;border-radius:10px;padding:10px 14px;font-size:14px;outline:none;transition:border-color .15s}
    .field-input:focus{border-color:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.12)}
    .login-btn{width:100%;background:#082C23;color:#fff;font-weight:700;font-size:14px;border:none;border-radius:10px;padding:12px;cursor:pointer;transition:background .15s;display:flex;align-items:center;justify-content:center;gap:8px}
    .login-btn:hover{background:#0d3d30}
    .login-btn:disabled{opacity:.6;cursor:not-allowed}
    .error-box{display:none;background:#fee2e2;color:#dc2626;font-size:13px;font-weight:600;border-radius:8px;padding:10px 12px;margin-bottom:16px}
    .error-box.show{display:block}
  </style>
</head>
<body>
  <div class="login-card">
    <div class="mb-6">
      <div class="brand-name">MISSÃO SIMPLIFICAR<span class="brand-sub">SEMANA ODS NA PRÁTICA · EM APOIO AO ODS 12 E AO ODS 8</span></div>
    </div>
    <div id="error-box" class="error-box"></div>
    <form id="login-form">
      <div class="mb-4">
        <label class="field-label" for="email">E-mail</label>
        <input class="field-input" type="email" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="mb-6">
        <label class="field-label" for="password">Senha</label>
        <input class="field-input" type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="login-btn" type="submit" id="submit-btn">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span>Entrar</span>
      </button>
    </form>
  </div>
  <script>
    lucide.createIcons();
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error-box');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('show');
      submitBtn.disabled = true;
      submitBtn.querySelector('span').textContent = 'Entrando...';
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok || data.isError) {
          errorBox.textContent = data.message || 'Não foi possível entrar.';
          errorBox.classList.add('show');
          submitBtn.disabled = false;
          submitBtn.querySelector('span').textContent = 'Entrar';
          return;
        }
        window.location.href = data.redirect || '/';
      } catch (err) {
        errorBox.textContent = 'Erro de conexão. Tente novamente.';
        errorBox.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.querySelector('span').textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
